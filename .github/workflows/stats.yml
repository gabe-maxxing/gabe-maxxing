name: Shipping stats

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: shipping-stats

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Collect and render
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: npx tsx scripts/stats.ts
      - name: Commit outputs
        run: |
          git config user.name gabe-maxxing
          git config user.email gabriel@corvus.gent
          git add stats
          git diff --cached --quiet || git commit -m "stats: daily refresh" && git push
